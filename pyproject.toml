[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-eval"
version = "0.7.0"
description = "Reproducible, explainable evaluation for generated music outputs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ruilin Gao" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
audiobox = ["audiobox_aesthetics>=0.0.4"]
clap = ["soxr>=0.5", "torch>=2.2", "transformers>=4.57"]
muq = ["muq==0.1.0", "soxr>=0.5"]
editing = ["musecpeval[structure]==0.3.0"]
production = ["pyloudnorm>=0.2", "scipy>=1.10"]
test = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[project.scripts]
music-eval = "music_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_eval = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-eval"
version = "0.8.0"
description = "Reproducible, explainable evaluation for generated music outputs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ruilin Gao" }]
keywords = [
  "music",
  "audio",
  "evaluation",
  "generative-music",
  "listening-test",
  "audio-quality",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ruiling-smartbear/TIMMY"
Repository = "https://github.com/ruiling-smartbear/TIMMY"
Issues = "https://github.com/ruiling-smartbear/TIMMY/issues"
Changelog = "https://github.com/ruiling-smartbear/TIMMY/blob/main/CHANGELOG.md"

[project.optional-dependencies]
audiobox = ["audiobox_aesthetics>=0.0.4"]
clap = ["soxr>=0.5", "torch>=2.2", "transformers>=4.57"]
muq = ["muq==0.1.0", "soxr>=0.5"]
editing = ["musecpeval[structure]==0.3.0"]
production = ["pyloudnorm>=0.2", "scipy>=1.10"]
test = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[project.scripts]
music-eval = "music_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_eval = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
